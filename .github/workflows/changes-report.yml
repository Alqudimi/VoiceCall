# =============================================================================
# changes-report.yml — automated changes analysis, documentation and publishing
#
# Runs on EVERY push to main (and manually via workflow_dispatch):
#   1. Full-history analysis of every commit + every file-change event
#   2. Statistical charts + comprehensive RTL-Arabic HTML map + screenshot
#   3. CHANGES.md regenerated and committed back to main
#   4. Rolling GitHub Release "changes-report" refreshed with all artifacts
#   5. GitHub Wiki pages (Home / Changelog / Changes-Map) updated
#
# Pushes made with the default GITHUB_TOKEN never trigger workflows again,
# so committing CHANGES.md back to main cannot cause an infinite loop.
# =============================================================================
name: Changes Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# The report is a snapshot of the newest state: a queued older run is always
# superseded by a newer one, so cancel it instead of piling up runs.
concurrency:
  group: changes-report
  cancel-in-progress: true

jobs:
  report:
    name: Analyze, document, publish (release + wiki)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ==========================================
      # Checkout — FULL history (all commits on main)
      # ==========================================
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # Environment
      # ==========================================
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/changes_report/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Download Arabic fonts (Noto Arabic + Kufi + JetBrains Mono)
        run: |
          set -euo pipefail
          mkdir -p .cache/changes-report-fonts
          BASE=".cache/changes-report-fonts"
          curl -fsSL -o "$BASE/NotoSansArabic.ttf" \
            "https://github.com/google/fonts/raw/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf"
          curl -fsSL -o "$BASE/NotoKufiArabic.ttf" \
            "https://github.com/google/fonts/raw/main/ofl/notokufiarabic/NotoKufiArabic%5Bwght%5D.ttf"
          curl -fsSL -o "$BASE/JetBrainsMono-Regular.ttf" \
            "https://github.com/JetBrains/JetBrainsMono/raw/master/fonts/ttf/JetBrainsMono-Regular.ttf"
          ls -lh "$BASE"

      # ==========================================
      # The full analysis pipeline
      # ==========================================
      - name: Run pipeline (commits.json, charts, map, CHANGES.md)
        env:
          FONTS_DIR: .cache/changes-report-fonts
          OUT_DIR: dist/changes-report
        run: bash scripts/changes_report/run_pipeline.sh

      # ==========================================
      # Commit the regenerated CHANGES.md back to main
      # (GITHUB_TOKEN pushes do not trigger workflows -> no loop)
      # ==========================================
      - name: Commit CHANGES.md to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGES.md
          if git diff --cached --quiet; then
            echo "CHANGES.md already up to date."
            exit 0
          fi
          git commit -m "docs(changelog): auto-update CHANGES.md for ${GITHUB_SHA::7} [skip ci]"
          if git push origin HEAD:main; then
            echo "CHANGES.md pushed to main."
          else
            echo "::warning::direct push rejected - retrying once after rebase"
            git pull --rebase origin main
            git push origin HEAD:main \
              || echo "::warning::could not commit CHANGES.md to main (branch protection?) - the release and wiki are still updated with the full document"
          fi

      # ==========================================
      # Rolling GitHub Release with all report artifacts
      # ==========================================
      - name: Publish rolling release (changes-report)
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_DIR: dist/changes-report
        run: bash scripts/changes_report/publish_release.sh

      # ==========================================
      # GitHub Wiki update (Home / Changelog / Changes-Map)
      # WIKI_TOKEN: optional classic PAT (repo scope) for reliable wiki push;
      # falls back to GITHUB_TOKEN and warns with instructions if it fails.
      # ==========================================
      - name: Update GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -n "$WIKI_TOKEN" ]; then
            export WIKI_TOKEN
          fi
          python scripts/changes_report/update_wiki.py \
            --summary dist/changes-report/summary.json \
            --changes CHANGES.md \
            --slug "$GITHUB_REPOSITORY" \
            --trigger-sha "$GITHUB_SHA"
