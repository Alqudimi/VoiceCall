# =============================================================================
# label-sync.yml — keeps the repository label set in sync with the canonical
# definitions in .github/labels.yml (create/rename/recolour on push).
# Run automatically when labels.yml changes, or manually any time.
# =============================================================================
name: Label sync

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/label-sync.yml"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: label-sync

jobs:
  sync:
    name: Sync labels from labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: false
