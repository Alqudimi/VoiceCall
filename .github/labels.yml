# =============================================================================
# labels.yml — the canonical label set for the repository.
# label-sync.yml creates / updates these on GitHub automatically.
# The same names are referenced by: labeler.yml (area labels),
# release-drafter.yml (release sections), stale.yml (exemptions),
# size-label.yml (size labels).
# =============================================================================
- name: bug
  color: "d73a4a"
  description: "شيء لا يعمل كما هو متوقع"

- name: enhancement
  color: "a2eeef"
  description: "ميزة جديدة أو تحسين وظيفي"

- name: performance
  color: "0e8a16"
  description: "تحسين الأداء أو زمن الاستجابة"

- name: documentation
  color: "0075ca"
  description: "تحسينات على التوثيق"

- name: security
  color: "d94c2e"
  description: "مسألة أمنية أو تعزيز أمني"

- name: question
  color: "d876e3"
  description: "استفسار يحتاج توضيحاً"

- name: duplicate
  color: "cfd3d7"
  description: "مشكلة أو طلب مكرر"

- name: invalid
  color: "e4e669"
  description: "بلاغ غير صحيح أو بلا معلومات كافية"

- name: wontfix
  color: "ffffff"
  description: "لن يُعالج — خارج النطاق الحالي"

- name: upstream
  color: "5319e7"
  description: "محجوز بانتظار مشروع/مكتبة خارجية"

- name: pinned
  color: "b60205"
  description: "مثبت — لا يُغلق تلقائياً (مستثنى من stale)"

- name: "lifecycle/keep"
  color: "b0b814"
  description: "إبقاء مفتوحاً رغم عدم النشاط (مستثنى من stale)"

- name: stale
  color: "cccccc"
  description: "بلا نشاط مؤخراً — يُغلق إن لم يُتفاعل معه"

